name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build API Server
        run: pnpm --filter @workspace/api-server run build
      
      - name: Build Frontend
        run: pnpm --filter @workspace/tovo-tv-os run build
      
      - name: Upload API Server artifact
        uses: actions/upload-artifact@v3
        with:
          name: api-server
          path: artifacts/api-server/dist/
          retention-days: 5
      
      - name: Upload Frontend artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend
          path: artifacts/tovo-tv-os/dist/
          retention-days: 5

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract version
        id: meta
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Build and push API Server image
        uses: docker/build-push-action@v5
        with:
          context: ./artifacts/api-server
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api-server:${{ steps.meta.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
